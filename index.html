<style>
*{box-sizing:border-box}html,body{height:100%}

.hint{font-size:12px;color:#aaa;text-align:center;margin-top:10px}
.nav{width:100%;max-width:640px;display:flex;gap:8px;padding:0 16px 16px}
.nav button{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;cursor:pointer;background:#e3e3df}
.nav button.next{flex:2;background:#3b6ef5;color:#fff}
.end{align-items:center;justify-content:center;text-align:center}.end h2{font-size:30px}.end p{color:#777}

document.getElementById('pos').textContent=i<n?`${i+1} / ${n}`:'완료';document.getElementById('pb').style.width=(100*Math.min(i,n)/n)+'%';
const el=document.getElementById('card');
if(i>=n){el.className='card end';el.innerHTML=`<h2>오늘 운동 끝!</h2><p>${day.t}</p><p style="font-size:13px">카드를 누르면 처음부터 다시</p>`;return}
const x=day.cards[i];el.className='card';
let tb=x.sec?`<span class="amt">${x.amt}</span><span class="cd" id="cd"></span>`:`<span class="amt">${x.amt}</span>${x.rest?`<span class="rl" id="rl">세트 끝나면 카드 누르기 → 휴식 ${fmt(x.rest)}</span><span class="cd" id="cd"></span>`:''}`;
el.innerHTML=`<div class="sec">${x.s}${phaseInfo(day,i)}</div><h2>${x.n}</h2>${x.img&&IMG[x.img]?`<div class="img"><img src="img/${IMG[x.img]}"></div>`:''}<div class="cue">${x.cue}</div><div class="time">${tb}</div><div class="hint">${x.rest?'한 번 누르면 휴식 타이머, 한 번 더 누르면 다음':'카드를 누르면 다음 동작'}</div>`;
if(x.sec)startT(x.sec)}
function startT(s){clearInterval(tm);left=s;paused=false;draw();tm=setInterval(()=>{if(paused)return;left--;draw();if(left>0&&left<=3)tick();if(left<=0){clearInterval(tm);beep()}},1000)}
function tap(){const day=D[cur],i=pos[cur]||0,x=day.cards[i];if(x&&x.rest&&!resting){resting=true;document.getElementById('card').classList.add('resting');document.getElementById('rl').textContent='휴식 중 · 끝나면 카드 누르기';startT(x.rest);return}next()}
function draw(){const e=document.getElementById('cd');if(!e)return;if(left<=0){e.textContent='✓';e.className='cd done'}else{e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');e.className='cd'}document.getElementById('pz').textContent=paused?'▶ 계속':'⏸ 타이머'}
function pauseT(e){e.stopPropagation();paused=!paused;draw()}
function save(){localStorage.setItem(K,JSON.stringify(pos))}
function next(){const n=D[cur].cards.length;let i=pos[cur]||0;pos[cur]=i>=n?0:i+1;save();show()}
function prev(){pos[cur]=Math.max(0,(pos[cur]||0)-1);save();show()}
let AC=null;
function unlock(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0)}catch(e){}}
document.addEventListener('pointerdown',unlock,true);document.addEventListener('keydown',unlock,true);
function tone(f,d,at,v){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t0=AC.currentTime+at;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.setValueAtTime(v,t0+d-.03);g.gain.linearRampToValueAtTime(0,t0+d);o.start(t0);o.stop(t0+d+.02)}
function tick(){tone(660,.12,0,.25)}
function beep(){tone(1046,.25,0,.35);tone(1046,.25,.35,.35);tone(1318,.5,.7,.35);try{navigator.vibrate&&navigator.vibrate([200,100,200,100,400])}catch(e){}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();tap()}if(e.key==='ArrowLeft')prev()});
tabs();show();
</script></body></html>
